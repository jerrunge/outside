<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Get Out — Trip</title>
<meta name="description" content="A fully-spec'd field plan: scenery, fishing, wildlife, water, permits, logistics, live weather, and an interactive packing list." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&family=Spectral:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root{
    --granite-900:#14171a;--granite-850:#181c1f;--granite-800:#1e2327;--granite-700:#262d32;--granite-600:#333c42;
    --line:#2c343a;--pine:#2f4a40;--pine-bright:#3c6354;--teal:#5fa3a0;--teal-dim:#3f7370;
    --rust:#834112;--rust-bright:#b65d22;--sand:#cdbfa6;--ink:#e9e3d6;--ink-dim:#a6a092;--ink-faint:#6f6c63;
    --warn:#b88a3a;--flag:#b65d22;--r:3px;--maxw:1180px;
    --shadow:0 1px 0 rgba(0,0,0,.5),0 14px 40px -24px rgba(0,0,0,.9);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;background:var(--granite-900);color:var(--ink);font-family:'Spectral',Georgia,serif;font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;}
  h1,h2,h3,h4,.disp{font-family:'Oswald',sans-serif;font-weight:500;letter-spacing:.01em;}
  .mono,.eyebrow,.klabel,.chip,.btn,.tag,.sub,.bcrumb{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.12em;font-weight:500;}
  a{color:var(--teal);text-decoration:none;}
  a:hover{color:var(--ink);}
  :focus-visible{outline:2px solid var(--rust-bright);outline-offset:2px;}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 22px;}

  /* top bar */
  .topbar{border-bottom:1px solid var(--line);background:var(--granite-850);position:sticky;top:0;z-index:50;backdrop-filter:blur(8px);}
  .topbar-inner{display:flex;align-items:center;justify-content:space-between;padding:11px 0;gap:12px;}
  .bcrumb{font-size:11.5px;color:var(--ink-faint);}
  .bcrumb a{color:var(--teal);}
  .topbar .nm{font-family:'Oswald';font-size:14px;color:var(--ink);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:50vw;}

  /* hero */
  header.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line);background:var(--granite-850);}
  .ridge{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.45;}
  .hero-inner{position:relative;padding:34px 0 26px;}
  .eyebrow{font-size:12px;color:var(--rust-bright);}
  .badges{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:9px;}
  .tag{font-size:10.5px;padding:4px 9px;border-radius:100px;border:1px solid var(--line);color:var(--ink-dim);background:var(--granite-800);}
  .tag.type-bp{color:var(--rust-bright);border-color:#5a3a23;}
  .tag.type-car{color:var(--teal);border-color:var(--teal-dim);}
  .tag.epic{background:var(--rust-bright);color:var(--granite-900);border-color:var(--rust-bright);}
  .tag.live{background:var(--pine-bright);color:var(--granite-900);border-color:var(--pine-bright);}
  .hero h1{font-size:clamp(30px,5.2vw,52px);line-height:1.0;margin:.1em 0 .12em;font-weight:600;}
  .hero .region{font-family:'Oswald';text-transform:uppercase;letter-spacing:.14em;color:var(--ink-faint);font-size:13px;}
  .hero .tagline{font-family:'Spectral';font-style:italic;color:var(--sand);font-size:19px;max-width:60ch;margin:14px 0 0;}
  .statline{display:flex;flex-wrap:wrap;gap:0;margin-top:20px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--granite-800);}
  .stat{flex:1;min-width:104px;padding:11px 14px;border-right:1px solid var(--line);}
  .stat:last-child{border-right:0;}
  .stat .k{font-family:'Oswald';text-transform:uppercase;letter-spacing:.1em;font-size:10px;color:var(--ink-faint);}
  .stat .v{font-family:'Oswald';font-size:18px;color:var(--ink);font-weight:500;margin-top:2px;}
  .stat .v.fish{color:var(--teal);} .stat .v.permit{color:var(--flag);}

  /* scoring */
  .scorebar{display:flex;gap:18px;flex-wrap:wrap;margin-top:18px;align-items:flex-end;}
  .pip{display:flex;flex-direction:column;align-items:center;gap:5px;}
  .pip .bars{display:flex;align-items:flex-end;gap:2px;height:30px;}
  .pip .bars i{width:5px;background:var(--granite-600);border-radius:1px;display:block;}
  .pip .bars i.on{background:var(--rust-bright);}
  .pip.f .bars i.on{background:var(--teal);}
  .pip .pl{font-family:'Oswald';font-size:10px;letter-spacing:.08em;color:var(--ink-dim);text-transform:uppercase;}
  .pip .pv{font-family:'Oswald';font-size:11px;color:var(--ink-faint);}

  /* layout */
  .grid{display:grid;grid-template-columns:1fr 340px;gap:34px;align-items:start;margin:34px 0;}
  @media(max-width:900px){.grid{grid-template-columns:1fr;}}
  section.sec{margin:0 0 30px;scroll-margin-top:64px;}
  .sec h2{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--sand);font-family:'Oswald';
    border-bottom:1px solid var(--rust);padding-bottom:6px;margin:0 0 14px;display:flex;align-items:baseline;gap:10px;}
  .sec h2 .n{color:var(--ink-faint);font-size:11px;margin-left:auto;text-transform:none;letter-spacing:.04em;font-style:normal;}
  .sec p{margin:0 0 12px;}
  .lead p{font-size:18px;color:var(--ink);}

  .whygrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media(max-width:560px){.whygrid{grid-template-columns:1fr;}}
  .whyitem{border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;background:var(--granite-850);border-left:3px solid var(--rust);}
  .whyitem.f{border-left-color:var(--teal);}
  .whyitem .wk{font-family:'Oswald';text-transform:uppercase;letter-spacing:.1em;font-size:10.5px;color:var(--ink-faint);display:flex;justify-content:space-between;}
  .whyitem .wk .sc{color:var(--rust-bright);}
  .whyitem.f .wk .sc{color:var(--teal);}
  .whyitem .wt{font-size:14.5px;color:var(--ink-dim);margin-top:4px;}

  .opt{border:1px solid var(--line);border-radius:var(--r);background:var(--granite-850);padding:13px 15px;margin-bottom:11px;}
  .opt .on{font-family:'Oswald';font-size:16px;color:var(--ink);font-weight:500;}
  .opt .os{font-family:'Oswald';text-transform:uppercase;letter-spacing:.08em;font-size:10.5px;color:var(--rust-bright);margin:3px 0 7px;}
  .opt .ot{font-size:14.5px;color:var(--ink-dim);margin:0;}
  .dayhikes{list-style:none;padding:0;margin:8px 0 0;}
  .dayhikes li{padding:7px 0 7px 20px;border-top:1px solid var(--line);position:relative;font-size:15px;color:var(--ink-dim);}
  .dayhikes li:before{content:'▸';position:absolute;left:2px;color:var(--teal);}

  .tagrow{display:flex;flex-wrap:wrap;gap:7px;margin:4px 0 0;}
  .pill{font-family:'Oswald';font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-dim);
    border:1px solid var(--line);border-radius:100px;padding:5px 11px;background:var(--granite-800);}

  .kv{display:grid;grid-template-columns:120px 1fr;gap:6px 14px;}
  .kv dt{font-family:'Oswald';text-transform:uppercase;letter-spacing:.08em;font-size:10.5px;color:var(--ink-faint);padding-top:3px;}
  .kv dd{margin:0;font-size:15px;color:var(--ink-dim);}
  .notebox{border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:var(--r);padding:10px 13px;background:var(--granite-850);color:var(--ink-dim);font-size:14px;margin-top:10px;}

  .checklist{list-style:none;padding:0;margin:0;}
  .checklist li{display:flex;gap:9px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line);font-size:14.5px;color:var(--ink-dim);}
  .checklist li:before{content:'⬡';color:var(--flag);font-size:13px;line-height:1.5;}
  .safety li:before{content:'△';color:var(--warn);}
  .insider li:before{content:'★';color:var(--rust-bright);}

  /* tide windows */
  .tidewins{display:flex;flex-direction:column;gap:10px;margin-top:12px;}
  .tidewin{border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;background:var(--granite-850);}
  .tw-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;}
  .tw-when{font-family:'Oswald';font-size:16px;color:var(--ink);letter-spacing:.02em;}
  .tw-tier{font-size:10.5px;padding:3px 8px;border-radius:100px;border:1px solid;white-space:nowrap;}
  .tw-tide{font-family:'Oswald';font-size:12.5px;letter-spacing:.02em;color:var(--sand);margin-top:5px;}
  .tw-note{font-size:14px;color:var(--ink-dim);margin-top:5px;}

  /* sidebar cards */
  .side{position:sticky;top:64px;display:flex;flex-direction:column;gap:18px;}
  @media(max-width:900px){.side{position:static;}}
  .card{border:1px solid var(--line);border-radius:var(--r);background:var(--granite-850);box-shadow:var(--shadow);overflow:hidden;}
  .card .ch{font-family:'Oswald';text-transform:uppercase;letter-spacing:.13em;font-size:11.5px;color:var(--sand);
    padding:11px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
  .card .cb{padding:13px 14px;}

  /* weather */
  .wx-now{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
  .wx-now .ic{font-size:34px;line-height:1;}
  .wx-now .t{font-family:'Oswald';font-size:30px;color:var(--ink);}
  .wx-now .d{font-size:13px;color:var(--ink-dim);}
  .wx-days{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;}
  .wx-d{text-align:center;border:1px solid var(--line);border-radius:var(--r);padding:7px 2px;background:var(--granite-800);}
  .wx-d .dn{font-family:'Oswald';font-size:9.5px;letter-spacing:.05em;color:var(--ink-faint);text-transform:uppercase;}
  .wx-d .em{font-size:17px;margin:3px 0;}
  .wx-d .hi{font-family:'Oswald';font-size:12px;color:var(--ink);}
  .wx-d .lo{font-family:'Oswald';font-size:11px;color:var(--ink-faint);}
  .wx-d .pp{font-size:9px;color:var(--teal);}
  .wx-note{font-size:12px;color:var(--ink-faint);margin-top:9px;font-style:italic;}

  /* best weeks strip — one row per month */
  .weeks{display:flex;flex-direction:column;gap:5px;}
  .wkrow{display:flex;align-items:center;gap:10px;}
  .wkm{font-family:'Oswald';font-size:10.5px;letter-spacing:.08em;color:var(--ink-faint);text-transform:uppercase;width:30px;flex:none;text-align:right;}
  .wkrow.has-peak .wkm{color:var(--rust-bright);}
  .wkrow.has-on .wkm{color:var(--ink-dim);}
  .wkcells{display:flex;gap:4px;}
  .wcell{width:30px;height:15px;border-radius:2px;background:var(--granite-700);}
  .wcell.on{background:var(--teal-dim);}
  .wcell.peak{background:var(--rust-bright);}
  .wk-legend{display:flex;gap:14px;margin-top:11px;padding-top:9px;border-top:1px solid var(--line);font-size:11px;color:var(--ink-faint);}
  .wk-legend span{display:inline-flex;align-items:center;gap:5px;}
  .swatch{width:10px;height:10px;border-radius:2px;display:inline-block;}

  /* fishing catchability + gear/flies */
  .catch{display:flex;align-items:center;gap:13px;margin:0 0 14px;padding:11px 13px;border:1px solid var(--line);border-left:3px solid var(--teal);border-radius:var(--r);background:var(--granite-850);}
  .catch .meter{display:flex;gap:3px;flex:none;}
  .catch .meter i{width:18px;height:10px;border-radius:2px;background:var(--granite-600);display:block;}
  .catch .meter i.on{background:var(--teal);}
  .catch .ct{font-family:'Oswald';text-transform:uppercase;letter-spacing:.05em;font-size:14px;color:var(--ink);line-height:1.1;}
  .catch .cs{font-family:'Oswald';font-size:10px;letter-spacing:.1em;color:var(--ink-faint);text-transform:uppercase;margin-top:3px;}
  .catch.none{border-left-color:var(--ink-faint);}
  .catch.none .ct{color:var(--ink-faint);}
  .fbox{margin-top:13px;}
  .fbox .fh{font-family:'Oswald';text-transform:uppercase;letter-spacing:.1em;font-size:10.5px;color:var(--teal);margin:0 0 7px;}
  .fly{display:inline-block;font-family:'Spectral';font-size:13.5px;color:var(--ink-dim);border:1px solid var(--line);border-radius:100px;padding:5px 11px;margin:0 6px 6px 0;background:var(--granite-800);}
  .gearline{font-size:14.5px;color:var(--ink-dim);}

  /* fly-fishing starter kit */
  .kit .kh{font-family:'Oswald';text-transform:uppercase;letter-spacing:.08em;font-size:13px;color:var(--sand);margin:22px 0 11px;padding-top:15px;border-top:1px solid var(--line);}
  .kit .kh .n{color:var(--ink-faint);font-size:11px;}
  .kitcat{margin-bottom:15px;}
  .kitcat .kchead{font-family:'Oswald';letter-spacing:.04em;font-size:14px;color:var(--teal);margin-bottom:6px;}
  .kititem{padding:8px 0;border-bottom:1px dashed var(--line);}
  .kititem:last-child{border-bottom:0;}
  .kiname{font-family:'Oswald';font-size:14.5px;color:var(--ink);display:flex;justify-content:space-between;gap:12px;align-items:baseline;}
  .kiprice{font-family:'Oswald';font-size:12px;color:var(--rust-bright);white-space:nowrap;letter-spacing:.03em;}
  .kinote{font-size:13.5px;color:var(--ink-dim);margin-top:3px;line-height:1.45;}
  .rig{border:1px solid var(--line);border-left:3px solid var(--teal);border-radius:var(--r);padding:10px 12px;margin-bottom:9px;background:var(--granite-850);}
  .rig .rigname{font-family:'Oswald';text-transform:uppercase;letter-spacing:.05em;font-size:13px;color:var(--ink);}
  .rig .rignote{font-size:13.5px;color:var(--ink-dim);margin-top:4px;line-height:1.45;}
  .klist{margin:0;padding-left:18px;} .klist li{font-size:14px;color:var(--ink-dim);margin:5px 0;}
  .ksteps{margin:0;padding-left:20px;counter-reset:none;} .ksteps li{font-size:14.5px;color:var(--ink-dim);margin:9px 0;line-height:1.55;}
  .daytl{display:flex;flex-direction:column;}
  .dayrow{display:grid;grid-template-columns:150px 1fr;gap:14px;padding:9px 0;border-bottom:1px solid var(--line);}
  .dayrow:last-child{border-bottom:0;}
  .dayt{font-family:'Oswald';text-transform:uppercase;letter-spacing:.04em;font-size:12px;color:var(--sand);}
  .dayw{font-size:14px;color:var(--ink-dim);line-height:1.45;}
  @media(max-width:600px){.dayrow{grid-template-columns:1fr;gap:2px;}}

  /* alternatives cross-link */
  .altgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  @media(max-width:600px){.altgrid{grid-template-columns:1fr;}}
  .altcard{display:block;border:1px solid var(--line);border-radius:var(--r);padding:12px 13px;background:var(--granite-850);text-decoration:none;transition:border-color .15s;}
  .altcard:hover{border-color:var(--teal-dim);}
  .altname{font-family:'Oswald';font-size:14.5px;color:var(--ink);letter-spacing:.02em;}
  .altnote{font-size:13px;color:var(--ink-dim);margin:5px 0 8px;line-height:1.4;}
  .altgo{font-family:'Oswald';text-transform:uppercase;letter-spacing:.08em;font-size:10.5px;color:var(--teal);}

  /* solo trip: dog status + notes */
  .dogband{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:var(--r);margin:0 0 20px;border:1px solid var(--line);}
  .dogband.ok{background:rgba(95,163,160,.1);border-color:var(--teal-dim);}
  .dogband.no{background:rgba(182,93,34,.08);border-color:#5a3a23;}
  .dogband .di{font-size:26px;line-height:1;flex:none;}
  .dogband .dt{font-family:'Oswald';text-transform:uppercase;letter-spacing:.06em;font-size:15px;color:var(--ink);}
  .dogband .dt b{color:var(--teal);}
  .dogband.no .dt b{color:var(--rust-bright);}
  .dogband .dn{font-size:13.5px;color:var(--ink-dim);margin-top:4px;line-height:1.45;}
  .solowrap{margin-top:10px;}
  .sologrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
  @media(max-width:600px){.sologrid{grid-template-columns:1fr;}}
  .solocard{border:1px solid var(--line);border-radius:var(--r);background:var(--granite-850);padding:12px 14px;}
  .solocard .sh{font-family:'Oswald';text-transform:uppercase;letter-spacing:.08em;font-size:10.5px;color:var(--sand);margin-bottom:6px;}
  .solocard .sb{font-size:13.5px;color:var(--ink-dim);line-height:1.5;}
  .bugmeter{display:flex;gap:10px;margin-top:2px;}
  .bugcol{flex:1;border:1px solid var(--line);border-radius:var(--r);padding:9px 11px;background:var(--granite-800);}
  .bugcol .bl{font-family:'Oswald';text-transform:uppercase;letter-spacing:.06em;font-size:10px;color:var(--ink-faint);}
  .bugcol .bv{font-size:13px;color:var(--ink-dim);margin-top:3px;line-height:1.4;}

  /* hero tools */
  .toolsbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;}
  .tbtn{display:inline-flex;align-items:center;gap:7px;font-family:'Oswald';text-transform:uppercase;letter-spacing:.09em;font-size:11px;color:var(--ink-dim);background:var(--granite-800);border:1px solid var(--line);border-radius:100px;padding:8px 14px;cursor:pointer;}
  .tbtn:hover{color:var(--ink);border-color:var(--teal-dim);}
  .tbtn.saved{background:var(--rust);border-color:var(--rust-bright);color:var(--ink);}
  .tbtn .i{font-size:13px;line-height:1;}

  /* permit planner */
  .planner label{font-family:'Oswald';text-transform:uppercase;letter-spacing:.08em;font-size:10.5px;color:var(--ink-faint);display:block;margin-bottom:6px;}
  .planner input[type=date]{width:100%;background:var(--granite-800);border:1px solid var(--line);border-radius:var(--r);color:var(--ink);padding:8px 10px;font-family:'Oswald';font-size:14px;color-scheme:dark;}
  .planres{margin-top:11px;display:flex;flex-direction:column;gap:8px;}
  .planres .pr{border:1px solid var(--line);border-left:3px solid var(--rust);border-radius:var(--r);padding:8px 11px;background:var(--granite-800);}
  .planres .pr .pl{font-family:'Oswald';text-transform:uppercase;letter-spacing:.08em;font-size:10px;color:var(--rust-bright);}
  .planres .pr .pd{font-family:'Oswald';font-size:15px;color:var(--ink);margin-top:2px;}
  .planres .pr .pn{font-size:12.5px;color:var(--ink-faint);margin-top:3px;}
  .planres .pr.open{border-left-color:var(--teal);}
  .planres .pr.open .pl{color:var(--teal);}
  .planner .caveat{font-size:12.5px;color:var(--ink-faint);font-style:italic;margin-top:10px;line-height:1.45;}

  /* print field-card */
  @media print{
    :root{--granite-900:#fff;--granite-850:#fff;--granite-800:#fff;--granite-700:#eee;--granite-600:#ccc;--line:#bbb;--ink:#111;--ink-dim:#222;--ink-faint:#555;--sand:#7a4a12;--teal:#1d6f6b;--teal-dim:#1d6f6b;--rust:#834112;--rust-bright:#8a3f12;--shadow:none;}
    body{font-size:10.5pt;background:#fff;color:#111;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .topbar,.ridge,#map,.noprint,.toolsbar{display:none!important;}
    .hero-inner{padding:4px 0 8px;}
    .hero h1{font-size:24pt;}
    .grid{display:block;margin:8px 0;}
    .side{position:static;}
    .card,.sec,.opt,.whyitem,.catch{break-inside:avoid;}
    .card{box-shadow:none;border:1px solid #bbb;margin-bottom:12px;}
    a{color:#111;text-decoration:none;}
    @page{margin:1.3cm;}
  }

  /* packing */
  .pk-head{display:flex;align-items:center;gap:10px;}
  .pk-prog{display:flex;gap:10px;margin:0 0 4px;}
  .pk-person{flex:1;}
  .pk-person .pn{font-family:'Oswald';text-transform:uppercase;letter-spacing:.08em;font-size:11px;color:var(--ink-dim);display:flex;justify-content:space-between;}
  .pk-person .bar{height:5px;background:var(--granite-700);border-radius:3px;margin-top:4px;overflow:hidden;}
  .pk-person .bar i{display:block;height:100%;background:var(--teal);width:0;transition:width .25s;}
  .pk-person.j .bar i{background:var(--rust-bright);}
  .pk-cat{font-family:'Oswald';text-transform:uppercase;letter-spacing:.1em;font-size:10px;color:var(--rust-bright);margin:14px 0 5px;}
  .pk-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-top:1px solid var(--line);}
  .pk-row .it{flex:1;font-size:14px;color:var(--ink-dim);}

  .ncard{border:1px solid var(--line);border-left:3px solid var(--type-c,var(--line));border-radius:var(--r);background:var(--granite-800);padding:9px 11px;display:block;}

<body>
<div class="topbar"><div class="wrap topbar-inner">
  <span class="bcrumb"><a href="index.html" id="bcHome">← Get Out</a> &nbsp;·&nbsp; <a href="gear.html">Kit</a> &nbsp;/&nbsp; <span id="bcType"></span></span>
  <span class="nm" id="bcName"></span>
</div></div>

<div id="app"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="data.js"></script>
<script>
/* ---------------- helpers ---------------- */
const $ = (s,r=document)=>r.querySelector(s);
const PIP_LABELS=['Scenery','Fish','Wildlife','Bugs','Water'];
const PIP_SHORT=['SCEN','FISH','WILD','BUGS','H2O'];
const MONTHS_SH=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function getId(){ return new URLSearchParams(location.search).get('id'); }
const TRIPS = window.TRIPS||[];
const trip = TRIPS.find(t=>t.id===getId());

/* ---------------- pips ---------------- */
function pipsHTML(s){
  return s.map((v,i)=>{
    let bars='';for(let b=1;b<=5;b++) bars+=`<i class="${b<=v?'on':''}" style="height:${5+b*4}px"></i>`;
    return `<div class="pip ${i===1?'f':''}"><div class="bars">${bars}</div><span class="pl">${PIP_SHORT[i]}</span><span class="pv">${v}/5</span></div>`;
  }).join('');
}

/* ---------------- best-weeks strip (grouped by month) ---------------- */
function weeksStrip(t){
  const start=new Date(2026,5,29); const groups=[]; let cur=null;
  for(let w=0;w<39;w++){
    const ws=new Date(start);ws.setDate(start.getDate()+w*7);
    const mid=new Date(ws);mid.setDate(ws.getDate()+3);const m=mid.getMonth()+1;
    const on=t.season.includes(m), peak=!!(t.peak&&t.peak.includes(m));
    if(!cur||cur.m!==m){cur={m,label:MONTHS_SH[m-1],weeks:[]};groups.push(cur);}
    cur.weeks.push({on,peak,label:MONTHS_SH[mid.getMonth()]+' '+mid.getDate()});
  }
  return groups;
}
function weeksHTML(groups){
  return groups.map(g=>{
    const cls=g.weeks.some(x=>x.peak)?'has-peak':g.weeks.some(x=>x.on)?'has-on':'';
    const cells=g.weeks.map(x=>`<span class="wcell ${x.peak?'peak':x.on?'on':''}" title="Week of ${x.label}${x.peak?' · PEAK':x.on?' · in season':''}"></span>`).join('');
    return `<div class="wkrow ${cls}"><span class="wkm">${g.label}</span><div class="wkcells">${cells}</div></div>`;
  }).join('');
}

/* ---------------- packing model ---------------- */
function basePacking(t){
  const cats={};
  cats['The Ten Essentials']=['Navigation (map / GPS / compass)','Sun protection (sunscreen, hat, shades)','Insulation (extra layers)','Headlamp + spare batteries','First-aid kit','Fire (lighter / matches)','Repair kit + knife','Extra food','Water + treatment','Emergency shelter'];
  if(t.type==='backpack'){
    cats['Backpacking']=['Backpack (40–55L)','Tent / shelter','Sleeping bag','Sleeping pad','Stove + fuel','Cook pot + spork','Water filter','Trekking poles'];
  } else {
    cats['Car Camp']=['Tent (roomy)','Sleeping bags + pads / cot','Camp chairs + table','Cooler + ice','2-burner stove + fuel','Water jugs','Lantern','Tarp / shade'];
  }
  if(t.s[1]>=2){ cats['Fishing']=['Rod + reel','Flies / lures','CA fishing license (on phone)','Net + forceps','Polarized glasses']; if(t.wild) cats['Fishing'].push('Barbless hooks (wild-trout regs)'); }
  if(t.s[4]>=3){ cats['Water & Swim']=['Quick-dry towel','Swim shoes / sandals','Dry bag']; }
  cats['Personal (both)']=['Meds + toiletries','Layered clothing','Rain shell','Camp shoes','Power bank'];
  if(t.d.pack&&t.d.pack.length) cats['Trip-specific']=t.d.pack.slice();
  return cats;
}
const PK_KEY=t=>'getout_pack_'+t.id;
function loadPack(t){ try{return JSON.parse(localStorage.getItem(PK_KEY(t)))||{}}catch(e){return {}} }
function savePack(t,d){ try{localStorage.setItem(PK_KEY(t),JSON.stringify(d))}catch(e){} }

/* ---------------- weather (Open-Meteo) ---------------- */
const WX={0:['☀️','Clear'],1:['🌤️','Mostly clear'],2:['⛅','Partly cloudy'],3:['☁️','Overcast'],45:['🌫️','Fog'],48:['🌫️','Rime fog'],
  51:['🌦️','Drizzle'],53:['🌦️','Drizzle'],55:['🌦️','Drizzle'],61:['🌧️','Rain'],63:['🌧️','Rain'],65:['🌧️','Heavy rain'],
  71:['🌨️','Snow'],73:['🌨️','Snow'],75:['❄️','Heavy snow'],77:['🌨️','Snow grains'],80:['🌦️','Showers'],81:['🌧️','Showers'],82:['⛈️','Violent showers'],
  85:['🌨️','Snow showers'],86:['❄️','Snow showers'],95:['⛈️','Thunderstorm'],96:['⛈️','Thunderstorm'],99:['⛈️','Hailstorm']};
function wxIcon(c){return (WX[c]||['🌡️','—'])}
async function loadWeather(t){
  const el=$('#wxBody'); if(!el) return;
  try{
    const u=`https://api.open-meteo.com/v1/forecast?latitude=${t.coord[0]}&longitude=${t.coord[1]}&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,weather_code&temperature_unit=fahrenheit&timezone=auto&forecast_days=7`;
    const r=await fetch(u); const j=await r.json();
    const cw=j.current, d=j.daily;
    const [ci,ct]=wxIcon(cw.weather_code);
    let days='';
    for(let i=1;i<7;i++){
      const dt=new Date(d.time[i]+'T00:00'); const [em]=wxIcon(d.weather_code[i]);
      days+=`<div class="wx-d"><div class="dn">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][dt.getDay()]}</div><div class="em">${em}</div><div class="hi">${Math.round(d.temperature_2m_max[i])}°</div><div class="lo">${Math.round(d.temperature_2m_min[i])}°</div><div class="pp">${d.precipitation_probability_max[i]||0}%</div></div>`;
    }
    el.innerHTML=`<div class="wx-now"><div class="ic">${ci}</div><div><div class="t">${Math.round(cw.temperature_2m)}°F</div><div class="d">${ct} · at the trailhead now</div></div></div>
      <div class="wx-days">${days}</div>
      <div class="wx-note">Live 6-day forecast at the trailhead coordinates. Expect colder, windier conditions higher up and overnight — plan layers accordingly.</div>`;
  }catch(e){
    el.innerHTML='<div class="wx-note">Couldn\'t load live weather right now. Check Open-Meteo or NWS before you go.</div>';
  }
}

/* ---------------- nearby ---------------- */
function nearby(t){
  const comp=x=>x.s[0]*5+x.s[1]*4+x.s[2]*3+x.s[3]*2+x.s[4];
  return TRIPS.filter(x=>x.id!==t.id)
    .map(x=>{
      let score=comp(x);
      if(x.type===t.type) score+=12;
      if(x.season.some(m=>t.season.includes(m))) score+=8;
      const dlat=Math.abs(x.coord[0]-t.coord[0]), dlng=Math.abs(x.coord[1]-t.coord[1]);
      if(dlat+dlng<2.2) score+=14;
      return {x,score};
    }).sort((a,b)=>b.score-a.score).slice(0,4).map(o=>o.x);
}

/* ---------------- fishing module ---------------- */
function fishingHTML(t){
  const f=t.d.fish; const c=f.catch||0;
  const fishIc=t.wild?'◐ wild':'○ stocked / mixed';
  const dots=[1,2,3,4,5].map(i=>`<i class="${i<=c?'on':''}"></i>`).join('');
  if(c===0){
    return `<div class="catch none"><div class="meter">${dots}</div><div><div class="ct">${esc(f.label||'No fishery')}</div><div class="cs">Catchability 0 / 5</div></div></div>
      <p style="color:var(--ink-faint);margin:0">Not a fishing destination — save the rod for another trip on the list.</p>`;
  }
  let h=`<div class="catch"><div class="meter">${dots}</div><div><div class="ct">${esc(f.label||'')}</div><div class="cs">Catchability ${c} / 5 · ${fishIc}</div></div></div>`;
  h+=`<dl class="kv"><dt>Water</dt><dd>${esc(f.water)}</dd><dt>Species</dt><dd>${esc(f.species)}</dd><dt>Method</dt><dd>${esc(f.method)}</dd><dt>Season</dt><dd>${esc(f.season)}</dd></dl>`;
  if(f.gear&&f.gear!=='—') h+=`<div class="fbox"><div class="fh">Recommended gear</div><div class="gearline">${esc(f.gear)}</div></div>`;
  if(f.flies&&f.flies.length&&f.flies[0]!=='—') h+=`<div class="fbox"><div class="fh">Flies &amp; lures</div>${f.flies.map(x=>`<span class="fly">${esc(x)}</span>`).join('')}</div>`;
  if(f.timing) h+=`<div class="fbox"><div class="fh">When</div><div class="gearline">${esc(f.timing)}</div></div>`;
  return h;
}

/* ---------------- solo trip: dog status + notes ---------------- */
function soloHTML(t){
  const dg=t.d.dog, so=t.d.solo;
  let h='<section class="sec solowrap"><h2>Solo &amp; Cooper Notes</h2>';
  h+=`<div class="dogband ${dg.ok?'ok':'no'}"><div class="di">${dg.ok?'🐾':'🚫'}</div><div><div class="dt">Cooper: <b>${dg.ok?'welcome':'stays home'}</b> — ${esc(dg.agency)}</div><div class="dn">${esc(dg.note)}</div></div></div>`;
  h+='<div class="sologrid">';
  h+=`<div class="solocard"><div class="sh">Altitude &amp; acclimation</div><div class="sb">${esc(so.altitude)}</div></div>`;
  h+=`<div class="solocard"><div class="sh">Communication</div><div class="sb">${esc(so.comms)}</div></div>`;
  h+='</div>';
  if(so.avoidOffTrail && so.avoidOffTrail.length){
    h+=`<div class="notebox" style="border-left-color:var(--rust-bright)"><b style="color:var(--rust-bright);font-family:Oswald;letter-spacing:.06em">SOLO: STAY ON TRAIL</b><br>${so.avoidOffTrail.map(esc).join('<br>')}</div>`;
  }
  h+='<div class="bugmeter">';
  h+=`<div class="bugcol"><div class="bl">Mosquito reality</div><div class="bv">${esc(so.mosquito.status)}</div></div>`;
  h+=`<div class="bugcol"><div class="bl">Best timing</div><div class="bv">${esc(so.mosquito.timing)}</div></div>`;
  h+='</div>';
  h+='</section>';
  return h;
}

/* ---------------- alternatives cross-link ---------------- */
function altsHTML(a){
  return `<section class="sec"><h2>Alternatives for this weekend <span class="n">same dates, same basecamp</span></h2>
    <div class="altgrid">${a.map(x=>`<a class="altcard" href="trip.html?id=${x.id}"><div class="altname">${esc(x.name)}</div><div class="altnote">${esc(x.note)}</div><div class="altgo">Open page →</div></a>`).join('')}</div></section>`;
}

/* ---------------- fly-fishing starter kit ---------------- */
function kitHTML(k){
  let h='<section class="sec kit"><h2>Fly-Fishing Starter Kit <span class="n">field school — assume you own nothing</span></h2>';
  h+=`<p style="color:var(--ink-dim);font-size:15px">${esc(k.intro)}</p>`;
  h+=`<p style="margin:2px 0 4px"><a href="gear.html">→ See the full shopping cart, rod comparison, and buy links on the Kit page</a></p>`;
  h+='<h3 class="kh">The kit to buy</h3>';
  k.shopping.forEach(c=>{
    h+=`<div class="kitcat"><div class="kchead">${esc(c.cat)}</div>`;
    c.items.forEach(it=>{ h+=`<div class="kititem"><div class="kiname">${esc(it.name)}${it.price?`<span class="kiprice">${esc(it.price)}</span>`:''}</div>${it.note?`<div class="kinote">${esc(it.note)}</div>`:''}</div>`; });
    h+='</div>';
  });
  h+='<h3 class="kh">Three rigs, easiest first</h3>';
  k.rigs.forEach(r=>{ h+=`<div class="rig"><div class="rigname">${esc(r.name)}</div><div class="rignote">${esc(r.how)}</div></div>`; });
  if(k.knots&&k.knots.length){ h+='<h3 class="kh">The only three knots you need</h3><ul class="klist">'+k.knots.map(x=>`<li>${esc(x)}</li>`).join('')+'</ul>'; }
  h+='<h3 class="kh">How to actually fish it</h3><ol class="ksteps">'+k.steps.map(s=>`<li>${esc(s)}</li>`).join('')+'</ol>';
  if(k.day&&k.day.length){ h+='<h3 class="kh">The honest day plan <span class="n">built around the gate</span></h3><div class="daytl">'+k.day.map(d=>`<div class="dayrow"><div class="dayt">${esc(d.t)}</div><div class="dayw">${esc(d.what)}</div></div>`).join('')+'</div>'; }
  h+='</section>';
  return h;
}

/* ---------------- saved trips (shared with hub) ---------------- */
const SAVE_KEY='getout_saved';
function getSaved(){try{return JSON.parse(localStorage.getItem(SAVE_KEY))||[]}catch(e){return[]}}
function setSaved(a){try{localStorage.setItem(SAVE_KEY,JSON.stringify(a))}catch(e){}}
function toggleSaved(id){let a=getSaved();a=a.includes(id)?a.filter(x=>x!==id):a.concat(id);setSaved(a);return a.includes(id);}

/* ---------------- GPX export ---------------- */
function downloadGPX(t){
  const desc=`${t.region} · ${t.type} · ~${t.drive}h from Pacifica · Permit: ${t.permit} · ${t.d.tag}`;
  const gpx=`<?xml version="1.0" encoding="UTF-8"?>\n`+
    `<gpx version="1.1" creator="Get Out — Reck the Fort" xmlns="http://www.topografix.com/GPX/1/1">\n`+
    `  <metadata><name>${esc(t.name)}</name></metadata>\n`+
    `  <wpt lat="${t.coord[0]}" lon="${t.coord[1]}">\n`+
    `    <name>${esc(t.name)}</name>\n    <desc>${esc(desc)}</desc>\n    <sym>Trailhead</sym>\n  </wpt>\n</gpx>\n`;
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([gpx],{type:'application/gpx+xml'}));
  a.download='getout-'+t.id+'.gpx'; document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
}

/* ---------------- permit release planner ---------------- */
const PERMIT_CAL={
  littlelakes:'inyo', shadow:'inyo',
  cathedral:'yosemite', laurel:'yosemite',
  lostcoast:'lostcoast', enchant:'lottery_spring', pointreyes:'recgov_pr',
  desolation:'recgov6mo', twentylakes:'recgov6mo',
  lakesbasin:'recgov6mo', junelake:'recgov6mo', bishopcreek:'recgov6mo', lassencar:'recgov6mo',
  mccloud:'recgov6mo', eastsierracar:'recgov6mo', pinnacles:'recgov6mo', joshuatree:'recgov6mo', deathvalley:'recgov6mo',
  hatcreek:'reservecal', bigsur:'reservecal', mendocino:'reservecal',
  emigrant:'selfissue', carsonpass:'selfissue', trinity:'selfissue', marble:'selfissue', lassenbc:'selfissue',
  skylakes:'selfissue', wallowas:'selfissue', steens:'selfissue', dvbackpack:'selfissue', ventana:'selfissue',
  jtbackpack:'selfissue', henrycoe:'selfissue', carrizo:'selfissue', alabamahills:'selfissue', anzaborrego:'selfissue'
};
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtD(d){return `${DOW[d.getDay()]}, ${MON[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;}
function minusMonths(d,n){return new Date(d.getFullYear(),d.getMonth()-n,d.getDate());}
function minusDays(d,n){const x=new Date(d);x.setDate(x.getDate()-n);return x;}
function computeRelease(type,entry){
  const today=new Date(); today.setHours(0,0,0,0);
  const past=d=>d<today?' · already open — book or check cancellations':'';
  const R=(label,date,note,open)=>({label,date:fmtD(date),note:note+past(date),open:open||date<today});
  switch(type){
    case 'inyo': return {rows:[
      R('60% advance block', minusMonths(entry,6), '7am PT, same calendar date 6 months out'),
      R('40% online block', minusDays(entry,14), '7am PT, same weekday, 2 weeks before')],
      caveat:'Inyo NF via recreation.gov. Quota season May 1–Nov 1; outside it, permits are unlimited (just register).'};
    case 'yosemite': return {rows:[
      R('Reservation opens', minusDays(entry,168), '7am PT, 24 weeks (168 days) ahead, rolling daily')],
      caveat:'Yosemite Wilderness via recreation.gov. Does NOT include Half Dome.'};
    case 'lostcoast': return {rows:[
      R('Permit release', minusDays(entry,90), '~7am PT, rolling ≈90 days ahead')],
      caveat:'King Range via recreation.gov. Some sources cite a 6-month window — verify. And CHECK TIDES before you book; some dates have no passable window.'};
    case 'reservecal': return {rows:[
      R('Reservation opens', minusMonths(entry,6), '8am PT, 6 months ahead, rolling daily')],
      caveat:'ReserveCalifornia (state-park campgrounds), 6-month rolling window.'};
    case 'recgov_pr': return {rows:[
      R('Reservation opens', minusDays(entry,90), 'rolling on recreation.gov (often ≈3 months)')],
      caveat:'Point Reyes backcountry via recreation.gov — confirm the current lead time.'};
    case 'recgov6mo': return {rows:[
      R('Reservation opens', minusMonths(entry,6), 'rolling, ≈6 months ahead on recreation.gov')],
      caveat:'recreation.gov lead time varies by unit — confirm the exact window for this site.'};
    case 'lottery_spring': return {rows:[], caveat:'Core lottery: the application window runs in late winter / early spring (≈ Feb–Mar) for the whole season, not per-date. Apply when it opens and treat a win as the trip of the year.'};
    default: return {rows:[], caveat:'No advance reservation — free self-issue or first-come. Register at the trailhead (or grab a walk-up) and go.'};
  }
}
function render(t){
  document.title='Get Out — '+t.name;
  $('#bcType').textContent=t.d.dog&&t.d.solo?'Solo Expedition':(t.type==='backpack'?'Backpacking':'Car camping');
  $('#bcName').textContent=t.name;
  if(t.d.dog&&t.d.solo){ const bh=$('#bcHome'); bh.href='solo.html'; bh.textContent='← Solo Expeditions'; }

  const d=t.d;
  const ws=weeksStrip(t);
  const fishIc=t.wild?'◐ wild':'○ stocked / mixed';

  // route block
  let routeHTML='';
  if(d.route.options){
    routeHTML=d.route.options.map(o=>`<div class="opt"><div class="on">${esc(o.name)}</div><div class="os">${esc(o.stat)}</div><p class="ot">${esc(o.text)}</p></div>`).join('');
  } else {
    routeHTML=`<div class="opt"><div class="on">Basecamp</div><p class="ot">${esc(d.route.basecamp)}</p>
      <ul class="dayhikes">${(d.route.dayhikes||[]).map(h=>`<li>${esc(h)}</li>`).join('')}</ul></div>`;
  }

  $('#app').innerHTML=`
  <header class="hero">
    <svg class="ridge" viewBox="0 0 1200 300" preserveAspectRatio="none" aria-hidden="true">
      <g fill="none" stroke="#26303a" stroke-width="1">
        <path d="M0,250 C160,210 300,238 430,205 C560,172 690,205 820,176 C950,148 1080,176 1200,150"/>
        <path d="M0,210 C180,180 300,196 450,158 C600,120 700,156 840,120 C980,86 1090,110 1200,84"/>
      </g></svg>
    <div class="wrap hero-inner">
      <div class="eyebrow">Reck the Fort · Field Plan</div>
      <div class="badges">
        <span class="tag ${t.type==='backpack'?'type-bp':'type-car'}">${t.type==='backpack'?'▲ Backpacking':'■ Car camping'}</span>
        ${t.epic?'<span class="tag epic">★ EPIC</span>':''}

  </header>

  <div class="wrap">
    ${t.status==='live'?`<div class="disclaim" style="margin-top:20px">There\'s also a standalone deep-dive page for this trip at <a href="${t.url}" target="_blank" rel="noopener">${t.url}</a>.</div>`:''}
    <div class="grid">

              <div class="whyitem ${i===1?'f':''}"><div class="wk"><span>${PIP_LABELS[i]}</span><span class="sc">${t.s[i]}/5</span></div><div class="wt">${esc(d.why[k])}</div></div>`).join('')}
          </div>
        </section>

        <section class="sec"><h2>${t.type==='backpack'?'Route &amp; Itinerary':'Basecamp &amp; Day Hikes'}</h2>${routeHTML}</section>

        <section class="sec"><h2>Fishing <span class="n">proven catchability</span></h2>${fishingHTML(t)}</section>
        ${d.kit?kitHTML(d.kit):''}

        <section class="sec"><h2>Wildlife</h2><div class="tagrow">${d.wild.map(w=>`<span class="pill">${esc(w)}</span>`).join('')}</div></section>

        <section class="sec"><h2>Water &amp; Swimming</h2>
          <div class="tagrow">${d.water.spots.map(s=>`<span class="pill">${esc(s)}</span>`).join('')}</div>
          ${t.skinny?`<div class="notebox" style="border-left-color:var(--sand)"><b style="color:var(--sand);font-family:Oswald;letter-spacing:.06em">~ SKINNY-DIP</b> &nbsp;${esc(d.water.skinny)}</div>`:`<p style="margin-top:10px;color:var(--ink-faint)">${esc(d.water.skinny)}</p>`}
        </section>

        <section class="sec"><h2>Permit &amp; Logistics</h2>
          <dl class="kv">
            <dt>System</dt><dd>${esc(d.permit.system)}</dd>
            <dt>Cost</dt><dd>${esc(d.permit.cost)}</dd>
            <dt>Where</dt><dd>${esc(d.permit.where)}</dd>
            ${d.permit.when?`<dt>Timing</dt><dd>${esc(d.permit.when)}</dd>`:''}
          </dl>
          ${d.permit.notes?`<div class="notebox">${esc(d.permit.notes)}</div>`:''}
        </section>

        ${d.tideWindows?`
        <section class="sec"><h2>Best Tide Windows <span class="n">next ~4 months · NOAA #9418024 · start dates</span></h2>
          ${d.tideNote?`<div class="notebox" style="border-left-color:var(--teal)">${esc(d.tideNote)}</div>`:''}
          <div class="tidewins">
          ${d.tideWindows.map(w=>{const c=/Top/.test(w.tier)?'var(--rust-bright)':(/season/i.test(w.tier)?'var(--teal)':(/lead|now/i.test(w.tier)?'var(--warn)':'var(--ink-faint)'));return `
            <div class="tidewin" style="border-left:3px solid ${c}">
              <div class="tw-h"><span class="tw-when">${esc(w.when)}</span><span class="tw-tier" style="color:${c};border-color:${c}">${esc(w.tier)}</span></div>
              <div class="tw-tide">${esc(w.tide)}</div>

            </div>`;}).join('')}

        <section class="sec"><h2>Getting There</h2>

            <dt>Route</dt><dd>${esc(d.drive.route)}</dd>

          </dl>
          ${(d.drive.flags&&d.drive.flags.length)?`<ul class="checklist safety" style="margin-top:8px">${d.drive.flags.map(f=>`<li>${esc(f)}</li>`).join('')}</ul>`:''}
        </section>
        ${d.alts?altsHTML(d.alts):''}

        <section class="sec"><h2>Insider Moves</h2>
          <ul class="checklist insider">${d.insider.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>
        </section>

        <section class="sec"><h2>Confirm Before You Go <span class="n">re-check at booking</span></h2>
          <ul class="checklist">${d.verify.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>
        </section>

        <section class="sec"><h2>Nearby &amp; Similar</h2>
          <div class="nearby">${nearby(t).map(n=>`<a class="ncard ${n.type==='backpack'?'bp':'car'}" href="trip.html?id=${n.id}"><div class="nn">${esc(n.name)}</div><div class="nr">${esc(n.region)} · ${n.drive}h</div></a>`).join('')}</div>
        </section>
      </div>

      <aside class="side">
        <div class="card noprint"><div class="ch">Live Weather</div><div class="cb" id="wxBody"><div class="wx-note">Loading trailhead forecast…</div></div></div>

        <div class="card"><div class="ch">Best Weeks <span style="font-family:Spectral;text-transform:none;letter-spacing:0;font-style:italic;color:var(--ink-faint);font-size:12px">Jul → Mar</span></div>
          <div class="cb">
            <div class="weeks">${weeksHTML(ws)}</div>
            <div class="wk-legend"><span><i class="swatch" style="background:var(--rust-bright)"></i>Peak</span><span><i class="swatch" style="background:var(--teal-dim)"></i>In season</span><span><i class="swatch" style="background:var(--granite-700)"></i>Off</span></div>
          </div>
        </div>

        <div class="card noprint" id="plannerCard"><div class="ch">Permit Release Planner</div>
          <div class="cb planner">
            <div id="plannerDate"><label for="entryDate">Your target entry date</label>
            <input type="date" id="entryDate"></div>
            <div class="planres" id="planRes"></div>
            <div class="caveat" id="planCaveat"></div>
          </div>
        </div>

        <div class="card">
          <div class="ch pk-head"><span>Packing List</span>
            <span class="pk-tools"><button class="btn sm" id="pkEdit">Edit</button><button class="btn sm" id="pkReset">Reset</button></span>
          </div>
          <div class="cb" id="pkBody"></div>

        <div class="card noprint"><div class="ch">Map</div><div id="map"></div></div>

    </div>

    <footer>
      <p>Field plan for <b style="color:var(--ink-dim)">Jeremy &amp; David</b>. Scores reflect your five criteria in priority order. Content blends verified 2026 research with deep destination knowledge — the <b style="color:var(--ink-dim)">Confirm Before You Go</b> list flags what to re-check (road, snow, tide, permit windows) at booking time.</p>
      <p style="margin-top:6px"><a href="index.html">← Back to the calendar</a></p>
    </footer>

  loadWeather(t);
  buildMap(t);
  buildPacking(t);
  buildTools(t);
  buildPlanner(t);
}

/* ---------------- map ---------------- */
function buildMap(t){
  const m=L.map('map',{scrollWheelZoom:false,attributionControl:false}).setView(t.coord, t.type==='backpack'?11:10);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{subdomains:'abcd',maxZoom:18}).addTo(m);
  const c=t.type==='backpack'?'#b65d22':'#5fa3a0';
  L.circleMarker(t.coord,{radius:8,color:c,weight:2,fillColor:c,fillOpacity:.5}).addTo(m)
    .bindPopup(`<b style="font-family:Oswald">${esc(t.name)}</b><br><span style="font-family:Oswald;font-size:10px;letter-spacing:.08em;color:#a6a092">TRAILHEAD / BASECAMP</span>`);
}

/* ---------------- packing render ---------------- */
function buildPacking(t){
  const base=basePacking(t);
  let store=loadPack(t); // {checks:{cat::item:{j,d}}, custom:{cat:[items]}, removed:[keys]}
  store.checks=store.checks||{}; store.custom=store.custom||{}; store.removed=store.removed||[];

  function itemKey(cat,it){return cat+'::'+it;}
  function compose(){
    const out={};
    Object.keys(base).forEach(cat=>{ out[cat]=base[cat].filter(it=>!store.removed.includes(itemKey(cat,it))); });
    Object.keys(store.custom).forEach(cat=>{ out[cat]=(out[cat]||[]).concat(store.custom[cat].filter(it=>!store.removed.includes(itemKey(cat,it)))); });
    return out;
  }
  function counts(comp){
    let tot=0,j=0,dd=0;
    Object.keys(comp).forEach(cat=>comp[cat].forEach(it=>{tot++;const c=store.checks[itemKey(cat,it)]||{};if(c.j)j++;if(c.d)dd++;}));
    return {tot,j,dd};
  }
  function draw(){
    const comp=compose(); const cc=counts(comp);
    const pj=cc.tot?Math.round(cc.j/cc.tot*100):0, pd=cc.tot?Math.round(cc.dd/cc.tot*100):0;
    let html=`<div class="pk-prog">
      <div class="pk-person j"><div class="pn"><span>Jeremy</span><span>${cc.j}/${cc.tot}</span></div><div class="bar"><i style="width:${pj}%"></i></div></div>
      <div class="pk-person"><div class="pn"><span>David</span><span>${cc.dd}/${cc.tot}</span></div><div class="bar"><i style="width:${pd}%"></i></div></div>
    </div>
    <div class="pk-row" style="border-top:0;padding-bottom:0"><span class="it" style="color:var(--ink-faint);font-size:11px;font-family:Oswald;letter-spacing:.06em;text-transform:uppercase">Item</span><span class="pk-cbh">JR</span><span class="pk-cbh">DV</span><span style="width:18px"></span></div>`;
    Object.keys(comp).forEach(cat=>{
      html+=`<div class="pk-cat">${esc(cat)}</div>`;
      comp[cat].forEach(it=>{
        const k=itemKey(cat,it), c=store.checks[k]||{};
        html+=`<div class="pk-row" data-k="${esc(k)}">
          <span class="it ${(c.j&&c.d)?'done':''}">${esc(it)}</span>
          <span class="pk-cb j ${c.j?'on':''}" data-p="j" role="checkbox" aria-checked="${!!c.j}" tabindex="0">✓</span>
          <span class="pk-cb d ${c.d?'on':''}" data-p="d" role="checkbox" aria-checked="${!!c.d}" tabindex="0">✓</span>
          <button class="pk-rm" data-rm="${esc(k)}" data-cat="${esc(cat)}" data-it="${esc(it)}" title="Remove">✕</button>
        </div>`;
      });
    });
    html+=`<div class="pk-add"><input id="pkNew" placeholder="Add item…" aria-label="Add packing item"><button class="btn sm" id="pkAddBtn">Add</button></div>`;
    const body=$('#pkBody'); body.innerHTML=html;

    body.querySelectorAll('.pk-cb').forEach(cb=>{
      const toggle=()=>{ const row=cb.closest('.pk-row'),k=row.dataset.k,p=cb.dataset.p;
        store.checks[k]=store.checks[k]||{}; store.checks[k][p]=!store.checks[k][p]; savePack(t,store); draw(); };
      cb.addEventListener('click',toggle);
      cb.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();toggle();}});
    });
    body.querySelectorAll('.pk-rm').forEach(b=>b.addEventListener('click',()=>{
      store.removed.push(b.dataset.rm); savePack(t,store); draw();
    }));
    const addBtn=$('#pkAddBtn');
    if(addBtn) addBtn.addEventListener('click',()=>{
      const v=$('#pkNew').value.trim(); if(!v) return;
      const cat='Trip-specific'; store.custom[cat]=store.custom[cat]||[]; store.custom[cat].push(v);
      savePack(t,store); draw(); $('#pkBody').classList&&0; $('#pkBody').parentElement.classList.add('editing');
    });
  }
  draw();

  $('#pkEdit').addEventListener('click',()=>{ const c=$('#pkBody'); c.classList.toggle('editing'); $('#pkEdit').textContent=c.classList.contains('editing')?'Done':'Edit'; });
  $('#pkReset').addEventListener('click',()=>{ if(confirm('Reset this packing list for both of you?')){ localStorage.removeItem(PK_KEY(t)); store={checks:{},custom:{},removed:[]}; draw(); } });
}

/* ---------------- tools (save / print / gpx) ---------------- */
function buildTools(t){
  const sb=$('#saveBtn');
  function paint(){ const on=getSaved().includes(t.id); sb.classList.toggle('saved',on); $('#saveIco').textContent=on?'★':'☆'; $('#saveLbl').textContent=on?'Saved to my trips':'Save to my trips'; }
  paint();
  sb.addEventListener('click',()=>{ toggleSaved(t.id); paint(); });
  $('#printBtn').addEventListener('click',()=>window.print());
  $('#gpxBtn').addEventListener('click',()=>downloadGPX(t));
}

/* ---------------- permit planner ---------------- */
function buildPlanner(t){
  const type=PERMIT_CAL[t.id]||'selfissue';
  const dateWrap=$('#plannerDate'), res=$('#planRes'), cav=$('#planCaveat'), input=$('#entryDate');
  const noDate=(type==='selfissue'||type==='lottery_spring');
  if(noDate) dateWrap.style.display='none';
  function run(){
    if(noDate){ res.innerHTML=''; cav.textContent=computeRelease(type,new Date()).caveat; return; }
    if(!input.value){ res.innerHTML='<div class="pr"><div class="pn">Pick a date to see exactly when permits release for it.</div></div>'; cav.textContent=computeRelease(type,new Date()).caveat; return; }
    const entry=new Date(input.value+'T00:00');
    const c=computeRelease(type,entry);
    res.innerHTML=c.rows.map(r=>`<div class="pr ${r.open?'open':''}"><div class="pl">${esc(r.label)}</div><div class="pd">${esc(r.date)}</div><div class="pn">${esc(r.note)}</div></div>`).join('');
    cav.textContent=c.caveat;
  }
  if(input) input.addEventListener('change',run);
  run();
}

/* ---------------- go: only now that everything above is declared ---------------- */
if(!trip){
  $('#app').innerHTML='<div class="wrap err"><h1 style="font-family:Oswald">Trip not found</h1><p>That trip id isn\'t in the library. <a href="index.html">Back to the calendar →</a></p></div>';
} else { render(trip); }
</script>
